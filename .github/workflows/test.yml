name: test

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  unit:
    # Pure-Python logic tests (project parsing in both formats, lockfile
    # discovery, in-place merge). No Swift toolchain needed, so run them fast on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run parser unit tests
        run: python3 test/test_parse.py
      - name: Run merge unit tests
        run: python3 test/test_merge.py

  selftest:
    # Must be macOS — the action calls `xcrun swift package update`.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # The same two packages in each project file format: classic
        # project.pbxproj, and the JSON project.xcproj from Xcode 27.2+.
        fixture: [Sample.xcodeproj, SampleJSON.xcodeproj]
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Run the action against the fixture project (dry-run)
        id: action
        uses: ./
        with:
          project: test/fixture/${{ matrix.fixture }}
          dry-run: 'true'

      - name: Assert outputs are set
        env:
          CHANGED: ${{ steps.action.outputs.dependencies-changed }}
          COUNT: ${{ steps.action.outputs.changed-count }}
        run: |
          set -euo pipefail
          echo "dependencies-changed='${CHANGED}'"
          echo "changed-count='${COUNT}'"
          if [ -z "${CHANGED}" ]; then
            echo "::error::dependencies-changed output was not set"
            exit 1
          fi
          if [ "${CHANGED}" != "true" ] && [ "${CHANGED}" != "false" ]; then
            echo "::error::dependencies-changed must be 'true' or 'false' (got '${CHANGED}')"
            exit 1
          fi
          if ! [[ "${COUNT}" =~ ^[0-9]+$ ]]; then
            echo "::error::changed-count must be an integer (got '${COUNT}')"
            exit 1
          fi
          # The fixture has no committed Package.resolved, so the fresh
          # resolution should always report at least one new pin.
          if [ "${CHANGED}" != "true" ]; then
            echo "::error::expected dependencies-changed=true for a fixture with no prior Package.resolved"
            exit 1
          fi

      - name: Ensure dry-run did not write Package.resolved into the fixture
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          set -euo pipefail
          resolved="test/fixture/${FIXTURE}/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          if [ -e "$resolved" ]; then
            echo "::error::dry-run unexpectedly wrote $resolved"
            exit 1
          fi
